/* حساب بصمة نصية (hash) بسيطة */
function hashCode(str){
  var hash = 0;
  if(!str) return hash;
  for(var i = 0; i < str.length; i++){
    var char = str.charCodeAt(i);
    hash = ((hash << 5) - hash) + char;
    hash = hash & hash; /* تحويل إلى 32-bit integer */
  }
  return String(hash);
}

/* جلب بصمة ملف index.html من السيرفر */
function fetchIndexHash(){
  return fetch('index.html?t=' + Date.now() + '&r=' + Math.random(), {
    cache: 'no-store',
    headers: { 'Cache-Control': 'no-cache' }
  })
    .then(function(res){
      if(!res.ok) throw new Error('fetch failed');
      return res.text();
    })
    .then(function(html){
      return hashCode(html);
    });
}

function getReturnProfit(r, d){
  var rp = parseFloat(r.profit);
  if(!isNaN(rp)) return rp;
  if(d && d.sales){
    for(var i=0;i<d.sales.length;i++){
      var s = d.sales[i];
      var sName = s.product || s.productName;
      var sDate = s.dateOnly || s.date || '';
      var rDate = r.date || '';
      if(sName === r.product && sDate === rDate){
        var saleQty = parseFloat(s.quantity || s.qty) || 0;
        var saleProfit = parseFloat(s.profit) || 0;
        var returnQty = parseFloat(r.qty) || 0;
        if(saleQty > 0) return (saleProfit / saleQty) * returnQty;
      }
    }
  }
  return 0;
}
/* ================= Daily profit ================= */
function getTodayStr(){
  var d = new Date();
  var y = d.getFullYear();
  var m = String(d.getMonth()+1).padStart(2,'0');
  var day = String(d.getDate()).padStart(2,'0');
  return y + '-' + m + '-' + day;
}

function getDailyProfit(){
  var d = gd(); if(!d) return 0;
  var today = getTodayStr();
  var sp = 0, rp = 0;
  if(d.sales) for(var i=0; i<d.sales.length; i++){
    var s = d.sales[i];
    if((s.dateOnly || s.date || '') === today) sp += parseFloat(s.profit)||0;
  }
  if(d.returns) for(var j=0; j<d.returns.length; j++){
    var r = d.returns[j];
    if((r.date || '') === today) rp += getReturnProfit(r, d);
  }
  return sp - rp;
}

function doLogin(){
  var uEl = document.getElementById('user_field_9821');
  var pEl = document.getElementById('pass_field_9821');
  if(!uEl || !pEl){ al('❌ حقول الدخول مفقودة'); return; }

  var email = String(uEl.value || '').trim().toLowerCase();
  var pass = String(pEl.value || '').trim();

  if(!email || !pass){ al('أدخل البريد وكلمة المرور'); return; }
  if(!email.includes('@')){ al('أدخل بريداً صحيحاً'); return; }

  al('⏳ جاري تسجيل الدخول...');

  if(!firebaseReady || !auth){ al('❌ Firebase غير جاهز'); return; }

  auth.signInWithEmailAndPassword(email, pass)
    .then(function(userCred){
      console.log('✅ تم تسجيل الدخول:', userCred.user.email);
    })
    .catch(function(err){
      var msg = 'خطأ في الدخول';
      if(err.code === 'auth/user-not-found') msg = '❌ البريد غير مسجّل';
      else if(err.code === 'auth/wrong-password') msg = '❌ كلمة المرور خطأ';
      else if(err.code === 'auth/invalid-email') msg = '❌ البريد غير صحيح';
      else if(err.code === 'auth/too-many-requests') msg = '⏳ حاول لاحقاً';
      else if(err.code === 'auth/network-request-failed') msg = '🌐 تحقق من الإنترنت';
      else msg = '❌ ' + err.message;
      al(msg);
    });
}

function addBranch(){
  if(!cb || !cb.isMain){ al('فقط الرئيسي'); return; }

  if(!un){ al('أدخل اسم المستخدم'); return; }

  // منع تكرار اسم الفرع
  if(DB.branches.some(function(b){ return (b.name||'').trim().toLowerCase() === n.toLowerCase(); })){
    alert('❌ هذا الاسم موجود مسبقاً');
    return;
  }
  // منع تكرار اسم المستخدم
  if(DB.branches.some(function(b){
    var other = ((b.username || b.name || '')).toString().trim().toLowerCase();
    return other === un;
  })){
    alert('❌ اسم المستخدم موجود مسبقاً');
    return;
  }

  var nid = Date.now();
  var main = DB.branches.filter(function(b){ return b.isMain; })[0];
  DB.branches.push({
    id: nid,
    name: n,
    username: un,
    
    isMain: false,
    parentId: main.id
  });
                DB.data[nid] = { products: [], sales: [], returns: [], expenses: [], customers: [], payments: [], manualDebts: [], suppliers: [], purchases: [], supplierPayments: [] };
  sv();
  pg('branches');
  mA('✅ تم إنشاء الفرع.\nاسم المستخدم: ' + un);
}



/* ================= تعديل وحذف الفروع ================= */
function editB(id){
  var b = null;
  for(var i=0; i<DB.branches.length; i++){
    if(String(DB.branches[i].id) === String(id)){ b = DB.branches[i]; break; }
  }
  if(!b){ alert('الفرع غير موجود'); return; }

  var curUser = b.username || '';
  var isMainBranch = !!b.isMain;
  var inputs = [
    { label:'الاسم', value: b.name },
    { label:'اسم المستخدم', value: curUser },

  ];

  mM('تعديل الفرع', inputs, function(v){
    var nn = (v[0]||'').trim();
    var nu = (v[1]||'').trim().toLowerCase();
    var np = (v[2]||'').trim();

    if(!nn){ mA('أدخل اسم الفرع'); return; }

    /* التحقق من تكرار الاسم */
    var newName = nn.toLowerCase();
    if(DB.branches.some(function(x){
      return String(x.id) !== String(id) && (x.name||'').trim().toLowerCase() === newName;
    })){
      alert('❌ هذا الاسم موجود مسبقاً'); return;
    }

    /* التحقق من تكرار اسم المستخدم */
    if(nu && DB.branches.some(function(x){
      var other = ((x.username || '')).toString().trim().toLowerCase();
      return String(x.id) !== String(id) && other === nu;
    })){
      alert('❌ اسم المستخدم موجود مسبقاً'); return;
    }

    /* التعديل */
    b.name = nn;
    if(nu) b.username = nu;
    if(np) b.pass = np;

    sv();

    /* إعادة رسم الصفحة الحالية */
    var activeMenu = document.querySelector('.menu-item.active');
    if(activeMenu){
      var pid = activeMenu.getAttribute('data-page');
      if(pid) pg(pid);
    }

    mA('✅ تم حفظ التعديلات\n👤 ' + b.name);
  });

  /* تعديل نص الرسالة ليعرض الأسطر */
  var mEl = document.getElementById('mMsg');
  if(mEl) mEl.style.whiteSpace = 'pre-line';
}

function delB(id){
  id = Number(id);
  if(id === 1){ mA('لا يمكن حذف الرئيسي'); return; }
  var b = null;
  for(var i=0; i<DB.branches.length; i++){
    if(Number(DB.branches[i].id) === id){ b = DB.branches[i]; break; }
  }
  if(!b){ alert('الفرع غير موجود'); return; }

  mC('حذف الفرع "' + b.name + '"؟', function(){
    DB.branches = DB.branches.filter(function(x){ return Number(x.id) !== id; });
    if(DB.data[id]) delete DB.data[id];
    sv();
    pg('branches');
    mA('✅ تم الحذف');
  });
}

function rRL(){
  var d = gd(); if(!d) return;
  var rs = document.getElementById('r_sale'); if(!rs) return;
  if(!d.sales.length){ rs.innerHTML = '<option value="">لا مبيعات</option>'; }
  else {
    var opts = '<option value="">-- اختر فاتورة --</option>';
    var count = 0;
    for(var i = d.sales.length - 1; i >= 0 && count < 50; i--){
      var s = d.sales[i];
      var origQty = parseFloat(s.quantity || s.qty) || 0;
      var returned = parseFloat(s.returnedQty) || 0;
      var remaining = origQty - returned;
      if(remaining <= 0) continue;
      opts += '<option value="' + i + '">' + (s.product||'') + ' × ' + origQty +
        (returned > 0 ? ' (متبقي: ' + remaining + ')' : '') +
        ' — ' + (s.dateOnly||s.date||'') + '</option>';
      count++;
    }
    rs.innerHTML = opts;
  }
  var rl = document.getElementById('rList');
  if(!d.returns || !d.returns.length){ rl.innerHTML = '<div class="empty">لا تراجعات</div>'; return; }
  rl.innerHTML = d.returns.slice().reverse().map(function(r){
    return '<div class="item-row"><div><div class="t">'+r.product+' × '+r.qty+'</div><div class="s">'+r.date+(r.reason?' • '+r.reason:'')+'</div></div><div class="amt" style="color:#ff4500">-'+fm(r.total)+' '+cs()+'</div></div>';
  }).join('');
}
function doReturn(){
  var d = gd(); if(!d){ al('سجل دخول'); return; }
  var idx = document.getElementById('r_sale').value;
  var q = parseFloat(document.getElementById('r_qty').value) || 0;
  var reason = document.getElementById('r_reason').value.trim();
  if(idx === ''){ al('اختر فاتورة'); return; }
  if(q <= 0){ al('كمية خطأ'); return; }
  var s = d.sales[parseInt(idx)];
  if(!s){ al('الفاتورة غير موجودة'); return; }
  var origQty = parseFloat(s.quantity || s.qty) || 0;
  var returnedSoFar = parseFloat(s.returnedQty) || 0;
  var remaining = origQty - returnedSoFar;
  if(remaining <= 0){ al('تم ترجيع هذه الفاتورة بالكامل'); return; }
  if(q > remaining){ al('الكمية المتاحة للترجيع: ' + remaining); return; }
    var price = s.sellPrice || s.price || 0;
  var buyPrice = parseFloat(s.buy);
  if(isNaN(buyPrice)){
    // fallback للفواتير القديمة التي لا تحتوي على buy
    buyPrice = 0;
    for(var k=0;k<d.products.length;k++){
      if(d.products[k].name === (s.product||s.productName)){
        buyPrice = parseFloat(d.products[k].buy) || 0;
        break;
      }
    }
  }
  var total = q * price;
  var returnProfit = (price - buyPrice) * q;
  var today = getTodayStr();
  d.returns.push({ id: Date.now(), product: s.product || s.productName, qty: q, price: price, buy: buyPrice, total: total, profit: returnProfit, reason: reason, date: today });
  for(var i=0;i<d.products.length;i++) if(d.products[i].name === (s.product||s.productName)){ d.products[i].qty = (parseFloat(d.products[i].qty)||0) + q; break; }
  s.returnedQty = returnedSoFar + q;
  sv();
  document.getElementById('r_qty').value = 1;
  document.getElementById('r_reason').value = '';
  rRL();
  mA('✅ تم ترجيع ' + fm(total) + ' ' + cs());
}

function rReports(pc){

function importData(e){

  var reader = new FileReader();
  reader.onload = function(ev){
    try {
      var data = JSON.parse(ev.target.result);

      if(!confirm('سيتم استبدال كل البيانات الحالية. متابعة؟')) return;

      if(st) st.textContent = '✅ تم الاستيراد. سيتم إعادة التحميل...';
      setTimeout(function(){ location.reload(); }, 1200);

    }
  };
  reader.readAsText(file);

function addToCart(){
  var d = gd(); if(!d){ al('سجل دخول'); return; }
  var pid = document.getElementById('s_product').value;
  var q = parseFloat(document.getElementById('s_qty').value) || 0;
  var mp = parseFloat(document.getElementById('manualPrice').value) || 0;
  if(!pid){ al('اختر صنف'); return; }
  if(q <= 0){ al('كمية خطأ'); return; }
  var p = null;
  for(var i=0;i<d.products.length;i++){
    if(String(d.products[i].id) === String(pid)){ p = d.products[i]; break; }
  }
  if(!p){ al('غير موجود'); return; }

  /* حساب الكمية المضافَة مسبقاً للسلة */
  var cartedQty = 0;
  saleCart.forEach(function(item){
    if(String(item.productId) === String(pid)) cartedQty += item.qty;
  });

  if(q + cartedQty > p.qty){
    al('الكمية المتوفرة: '+(p.qty - cartedQty));
    return;
  }

  var sellPrice = (mp > 0) ? mp : p.sell;

  /* إذا كان الصنف موجوداً بنفس السعر - دمج */
  var existing = -1;
  for(var k=0;k<saleCart.length;k++){
    if(String(saleCart[k].productId) === String(pid) && saleCart[k].sellPrice === sellPrice){
      existing = k; break;
    }
  }

  if(existing >= 0){
    saleCart[existing].qty += q;
    saleCart[existing].total = saleCart[existing].qty * saleCart[existing].sellPrice;
  } else {
    saleCart.push({
      productId: p.id,
      productName: p.name,
      qty: q,
      sellPrice: sellPrice,
      buy: parseFloat(p.buy) || 0,
      total: q * sellPrice
    });
  }

  renderCartBox();
  document.getElementById('s_qty').value = 1;
  document.getElementById('manualPrice').value = '';
}

function removeFromCart(idx){
  idx = parseInt(idx);
  if(isNaN(idx) || idx < 0 || idx >= saleCart.length) return;
  saleCart.splice(idx, 1);
  renderCartBox();
}

  if(!saleCart.length){ al('الفاتورة فارغة'); return; }
  mC('مسح كل أصناف الفاتورة؟', function(){
    saleCart = [];
    renderCartBox();
  });
}

  } else {

  }

    }
    if(!p){ al('الصنف '+item.productName+' غير موجود'); return; }

  var notes = (document.getElementById('saleNotes').value || '').trim();

  var itemsCount = saleCart.length;

      if(String(d.products[j].id) === String(item.productId)){ p = d.products[j]; break; }
    }
    if(!p) return;

    var profit = (item.sellPrice - item.buy) * item.qty;
    d.sales.push({
      id: 's_' + cb.id + '_' + Date.now() + '_' + Math.floor(Math.random()*10000),

      price: item.sellPrice,
      buy: item.buy,
      total: item.total,
      profit: profit,
      notes: notes,
      date: today,
      paymentType: payType,
      customerId: customerId,
      customerName: customerName
    });

    p.qty -= item.qty;
    invoiceTotal += item.total;
  });

  ], function(v){

    var newName = nn.toLowerCase();

    p.sell = isNaN(ns) ? 0 : ns;
    p.qty  = isNaN(nq) ? 0 : nq;
        p.minQty = isNaN(nm) ? 2 : nm;
    sv();
    rPL();
    mA('✅ تم التعديل');
  });
}
/* ================= حذف وتعديل فاتورة بيع ================= */
function findSaleById(sid){
  var d = gd(); if(!d) return null;
  for(var i=0;i<d.sales.length;i++){
    if(String(d.sales[i].id) === String(sid)){
      return { sale: d.sales[i], index: i };
    }
  }
  return null;
}

function delSale(sid){
  var d = gd(); if(!d){ al('سجل دخول'); return; }
  var found = findSaleById(sid);
  if(!found){ alert('الفاتورة غير موجودة'); return; }
  var s = found.sale;
  var idx = found.index;

  var name = s.product || s.productName || '-';
  var qty = parseFloat(s.quantity != null ? s.quantity : s.qty) || 0;
  var total = parseFloat(s.total) || 0;
  var isCredit = s.paymentType === 'credit';
  var custName = s.customerName || '';

  var warn = '';
  if(isCredit && custName){
    warn = '\n\n⚠️ هذه فاتورة دين على العميل: '+custName+'\nسيتم خصم '+fm(total)+' من رصيده.';
  }

  var msg = '🗑️ حذف فاتورة؟\n\n'+
    '📦 '+name+' × '+qty+'\n'+
    '💰 '+fm(total)+' '+cs()+'\n'+
    '📅 '+(s.dateOnly || s.date || '')+
    warn+
    '\n\n✅ سيتم إرجاع الكمية '+qty+' إلى المخزون';

  mC(msg, function(){
    /* 1) إرجاع الكمية للمخزون */
    for(var j=0; j<d.products.length; j++){
      if(d.products[j].name === name){
        d.products[j].qty = (parseFloat(d.products[j].qty)||0) + qty;
        break;
      }
    }
    /* 2) حذف الفاتورة */
    d.sales.splice(idx, 1);
    sv();
    /* 3) إعادة رسم قائمة المبيعات */
    rSL();
    mA('✅ تم حذف الفاتورة وإرجاع '+qty+' إلى المخزون');
  });
  /* تعديل نص الرسالة ليعرض الأسطر */
  var mEl = document.getElementById('mMsg');
  if(mEl) mEl.style.whiteSpace = 'pre-line';
}

function editSale(sid){
  var d = gd(); if(!d){ al('سجل دخول'); return; }
  var found = findSaleById(sid);
  if(!found){ alert('الفاتورة غير موجودة'); return; }
  var s = found.sale;

  var curQty = parseFloat(s.quantity != null ? s.quantity : s.qty) || 0;
  var curPrice = parseFloat(s.sellPrice != null ? s.sellPrice : s.price) || 0;

  /* رصيد المخزون المتاح + الكمية القديمة (لأن الكمية القديمة لا تزال محسوبة) */
  var stockAvailable = 0;
  for(var k=0;k<d.products.length;k++){
    if(d.products[k].name === (s.product || s.productName)){
      stockAvailable = parseFloat(d.products[k].qty) || 0;
      break;
    }
  }
  var maxQty = stockAvailable + curQty;

  md({
    title: '✏️ تعديل فاتورة',
    msg: '📦 '+(s.product||s.productName)+'\n'+
         'الكمية الحالية: '+curQty+'\n'+
         'السعر الحالي: '+fm(curPrice)+' '+cs()+'\n'+
         'المتاح من المخزون: '+maxQty,
    inputs: [
      { label: 'الكمية الجديدة', value: curQty },
      { label: 'سعر البيع الجديد', value: curPrice }
    ],
    btns: [
      { t:'إلغاء', c:'mno' },
      { t:'حفظ', c:'mok', fn: function(v){
        var nq = parseFloat(v[0]) || 0;
        var np = parseFloat(v[1]) || 0;
        if(nq <= 0){ mA('الكمية يجب أن تكون أكبر من صفر'); return; }
        if(np <= 0){ mA('السعر يجب أن يكون أكبر من صفر'); return; }
        if(nq > maxQty){ mA('الكمية المتاحة: '+maxQty); return; }

        var buyPrice = parseFloat(s.buy) || 0;
        var diff = nq - curQty; // موجب = زيادة = نخصم من المخزون
        var newTotal = nq * np;
        var newProfit = (np - buyPrice) * nq;

        /* تعديل المخزون حسب الفرق */
        for(var k=0;k<d.products.length;k++){
          if(d.products[k].name === (s.product || s.productName)){
            d.products[k].qty = (parseFloat(d.products[k].qty)||0) - diff;
            break;
          }
        }

        /* تحديث الفاتورة */
        s.quantity = nq;
        s.qty = nq;
        s.sellPrice = np;
        s.price = np;
        s.total = newTotal;
        s.profit = newProfit;

        sv();
        rSL();
        mA('✅ تم التعديل');
      }}
    ]
  });
  var mEl = document.getElementById('mMsg');
  if(mEl) mEl.style.whiteSpace = 'pre-line';
}

/* ================= الديون ================= */
function customerBalance(custId, d){
  var owed = 0;
  (d.sales||[]).forEach(function(s){
    if(s.paymentType === 'credit' && String(s.customerId) === String(custId)){
      owed += parseFloat(s.total) || 0;
    }
  });
  (d.payments||[]).forEach(function(p){
    if(String(p.customerId) === String(custId)){
      owed -= parseFloat(p.amount) || 0;
    }
  });
  (d.manualDebts||[]).forEach(function(md){
    if(String(md.customerId) === String(custId)){
      owed += parseFloat(md.amount) || 0;
    }
  });
  return owed;
}

document.addEventListener('click', function(e){
  var el = e.target;
  while(el && el !== document.body){
    if(el.hasAttribute && el.hasAttribute('data-pay-cust')){
      e.preventDefault();
      try { payDebt(el.getAttribute('data-pay-cust')); }
      catch(err){ alert('❌ خطأ: ' + err.message); }
      return;
    }
    if(el.hasAttribute && el.hasAttribute('data-manual-debt')){
      e.preventDefault();
      try { addManualDebt(el.getAttribute('data-manual-debt')); }
      catch(err){ alert('❌ خطأ: ' + err.message); }
      return;
    }
    if(el.hasAttribute && el.hasAttribute('data-del-manual')){
      e.preventDefault();
      try { delManualDebt(el.getAttribute('data-del-manual')); }
      catch(err){ alert('❌ خطأ: ' + err.message); }
      return;
    }
        if(el.hasAttribute && el.hasAttribute('data-show-payments')){
      e.preventDefault();
      try { showCustomerPayments(el.getAttribute('data-show-payments')); }
      catch(err){ alert('❌ خطأ: ' + err.message); }
      return;
    }
    if(el.hasAttribute && el.hasAttribute('data-cust-sales')){
      e.preventDefault();
      try { showCustomerSales(el.getAttribute('data-cust-sales')); }
      catch(err){ alert('❌ خطأ: ' + err.message); }
      return;
    }
    if(el.hasAttribute && el.hasAttribute('data-del-cust')){
      e.preventDefault();
      try { delCustomer(el.getAttribute('data-del-cust')); }
      catch(err){ alert('❌ خطأ: ' + err.message); }
      return;
    }
    el = el.parentNode;
  }
});

function supplierBalance(supId, d){
  var owed = 0;
  (d.purchases||[]).forEach(function(p){
    if(p.paymentType === 'credit' && String(p.supplierId) === String(supId)){
      owed += parseFloat(p.total) || 0;
    }
  });
  (d.supplierPayments||[]).forEach(function(p){
    if(String(p.supplierId) === String(supId)){
      owed -= parseFloat(p.amount) || 0;
    }
  });
  return owed;
}

          if(String(d.products[i].id) === String(pid)){
            prIn.value = d.products[i].buy || 0;
            break;
          }
        }
      };
      pSel.onchange = updatePrice;
      updatePrice();
    }
    var ptSel = document.getElementById('pur_payType');
    if(ptSel){
      ptSel.onchange = function(){
        document.getElementById('pur_supBox').style.display = this.value === 'credit' ? 'block' : 'none';
      };
    }
  }, 50);

  var bs = $('mBtns'); bs.innerHTML = '';
  var btnCancel = document.createElement('button');
  btnCancel.className = 'mno'; btnCancel.textContent = 'إلغاء'; btnCancel.type = 'button';
  btnCancel.onclick = function(){ bg.classList.remove('on'); };
  bs.appendChild(btnCancel);

  var btnSave = document.createElement('button');
  btnSave.className = 'mok'; btnSave.textContent = 'حفظ'; btnSave.type = 'button';
  btnSave.onclick = function(){
    var pid = document.getElementById('pur_prod').value;
    var q = parseFloat(document.getElementById('pur_qty').value) || 0;
    var pr = parseFloat(document.getElementById('pur_price').value) || 0;
    var pt = document.getElementById('pur_payType').value;
    var supId = pt === 'credit' ? document.getElementById('pur_sup').value : null;
    var notes = (document.getElementById('pur_notes').value || '').trim();

    if(q <= 0){ mA('الكمية غير صحيحة'); return; }
    if(pr <= 0){ mA('السعر غير صحيح'); return; }
    if(pt === 'credit' && !supId){ mA('اختر المورد'); return; }

    var p = null;
    for(var i=0;i<d.products.length;i++){
      if(String(d.products[i].id) === String(pid)){ p = d.products[i]; break; }
    }
    if(!p){ mA('الصنف غير موجود'); return; }

    var supName = '';
    if(pt === 'credit'){
      for(var k=0;k<d.suppliers.length;k++){
        if(String(d.suppliers[k].id) === String(supId)){ supName = d.suppliers[k].name; break; }
      }
    }

    var total = q * pr;
    var today = getTodayStr();

    /* إضافة إلى المخزون */
    p.qty = (parseFloat(p.qty)||0) + q;
    /* تحديث سعر الشراء الأخير */
    p.buy = pr;

    /* تسجيل الفاتورة */
    if(!d.purchases) d.purchases = [];
    d.purchases.push({
      id: 'p_' + cb.id + '_' + Date.now(),
      date: today,
      productId: p.id,
      productName: p.name,
      qty: q,
      unitPrice: pr,
      total: total,
      paymentType: pt,
      supplierId: supId,
      supplierName: supName,
      notes: notes
    });

    sv();
    bg.classList.remove('on');
    mA('✅ تم تسجيل فاتورة شراء '+fm(total)+' '+cs()+'\n📦 أُضيفت '+q+' للمخزون');
    pg('suppliers');
  };
  bs.appendChild(btnSave);

  bg.classList.add('on');
}

function paySupplier(supId){
  var d = gd(); if(!d) return;
  var s = null;
  for(var i=0;i<d.suppliers.length;i++){
    if(String(d.suppliers[i].id) === String(supId)){ s = d.suppliers[i]; break; }
  }
  if(!s){ alert('المورد غير موجود'); return; }
  var bal = supplierBalance(s.id, d);

  md({
    title: '💵 تسديد للمورد',
    msg: 'المورد: '+s.name+'\nالرصيد الحالي: '+fm(bal)+' '+cs(),
    inputs: [
      { label: 'المبلغ المُسدَّد', value: bal > 0 ? bal : '' },
      { label: 'ملاحظة (اختياري)', value: '' }
    ],
    btns: [
      { t:'إلغاء', c:'mno' },
      { t:'تسديد', c:'mok', fn: function(v){
        var amt = parseFloat(v[0]) || 0;
        if(amt <= 0){ mA('أدخل مبلغ صحيح'); return; }
        if(!d.supplierPayments) d.supplierPayments = [];
        d.supplierPayments.push({
          id: Date.now(),
          supplierId: s.id,
          amount: amt,
          notes: (v[1]||'').trim(),
          date: getTodayStr()
        });
        sv();
        pg('suppliers');
        mA('✅ تم تسديد '+fm(amt)+' '+cs());
      }}
    ]
  });
  var mEl = document.getElementById('mMsg');
  if(mEl) mEl.style.whiteSpace = 'pre-line';
}

function showSupplierDetails(supId){
  var d = gd(); if(!d) return;
  var s = null;
  for(var i=0;i<d.suppliers.length;i++){
    if(String(d.suppliers[i].id) === String(supId)){ s = d.suppliers[i]; break; }
  }
  if(!s){ alert('المورد غير موجود'); return; }

  var purchases = (d.purchases||[]).filter(function(p){
    return String(p.supplierId) === String(supId) && p.paymentType === 'credit';
  });
  var payments = (d.supplierPayments||[]).filter(function(p){
    return String(p.supplierId) === String(supId);
  });
  var bal = supplierBalance(supId, d);
  var totalPurchases = purchases.reduce(function(a,p){ return a + (parseFloat(p.total)||0); }, 0);
  var totalPaid = payments.reduce(function(a,p){ return a + (parseFloat(p.amount)||0); }, 0);

  var txt = '🏭 المورد: '+s.name+(s.phone ? ' ('+s.phone+')' : '')+'\n\n';
  txt += '📊 الملخص:\n';
  txt += '   • إجمالي المشتريات (دين): '+fm(totalPurchases)+' '+cs()+'\n';
  txt += '   • إجمالي المُسدَّد: '+fm(totalPaid)+' '+cs()+'\n\n';

  txt += '🛒 فواتير الشراء ('+purchases.length+'):\n';
  if(!purchases.length) txt += '   لا يوجد\n';
  else {
    purchases.slice(-10).forEach(function(p){
      txt += '   • '+(p.productName||'')+' × '+p.qty+' = '+fm(p.total)+'\n';
      txt += '     📅 '+p.date+'\n';
    });
    if(purchases.length > 10) txt += '   ... و '+(purchases.length-10)+' فاتورة أقدم\n';
  }

  txt += '\n💵 التسديدات ('+payments.length+'):\n';
  if(!payments.length) txt += '   لا يوجد\n';
  else {
    payments.slice(-10).forEach(function(p){
      txt += '   • '+fm(p.amount)+' '+cs()+'  📅 '+p.date+(p.notes ? ' — '+p.notes : '')+'\n';
    });
    if(payments.length > 10) txt += '   ... و '+(payments.length-10)+' تسديد أقدم\n';
  }

  txt += '\n━━━━━━━━━━━━━━━━━\n';
  if(bal > 0)      txt += '💸 أنت مدين له: '+fm(bal)+' '+cs();
  else if(bal < 0) txt += '💚 له عندك رصيد: '+fm(Math.abs(bal))+' '+cs();
  else             txt += '✅ الحساب مُسدَّد بالكامل';

  mA(txt, '📊 كشف حساب مورد: '+s.name);
  var mEl = document.getElementById('mMsg');
  if(mEl) mEl.style.whiteSpace = 'pre-line';
}

/* ============ تفويض أزرار الموردين ============ */
document.addEventListener('click', function(e){
  var el = e.target;
  while(el && el !== document.body){
    if(el.hasAttribute && el.hasAttribute('data-pay-sup')){
      e.preventDefault();
      try { paySupplier(el.getAttribute('data-pay-sup')); }
      catch(err){ alert('❌ خطأ: ' + err.message); }
      return;
    }
    if(el.hasAttribute && el.hasAttribute('data-sup-details')){
      e.preventDefault();
      try { showSupplierDetails(el.getAttribute('data-sup-details')); }
      catch(err){ alert('❌ خطأ: ' + err.message); }
      return;
    }
    if(el.hasAttribute && el.hasAttribute('data-del-sup')){
      e.preventDefault();
      try { delSupplier(el.getAttribute('data-del-sup')); }
      catch(err){ alert('❌ خطأ: ' + err.message); }
      return;
    }
    el = el.parentNode;
  }
});

/* ================= مشاركة الفاتورة عبر واتساب ================= */
function shareInvoiceWhatsApp(invoiceId){
  var d = gd(); if(!d){ al('سجل دخول'); return; }

  var sales = d.sales || [];
  var items = [];
  if(invoiceId){
    items = sales.filter(function(s){ return s.invoiceId === invoiceId; });
  }
  if(!items.length){
    /* fallback: آخر فاتورة */
    for(var i = sales.length - 1; i >= 0; i--){
      if(sales[i].invoiceId){
        var lastInv = sales[i].invoiceId;
        items = sales.filter(function(s){ return s.invoiceId === lastInv; });
        break;
      }
    }
    if(!items.length && sales.length){
      items = [sales[sales.length-1]];
    }
  }
  if(!items.length){ mA('لا توجد فاتورة للمشاركة'); return; }

  var first = items[0];
  var branchName = cb ? cb.name : 'حميدو';
  var date = first.dateOnly || first.date || getTodayStr();
  var payType = first.paymentType === 'credit' ? '📝 دين (آجل)' : '💵 نقدي';
  var customer = first.customerName || '';
  var notes = first.notes || '';

  /* بناء نص الرسالة */
  var txt = '';
  txt += '🧾 *فاتورة جديدة*\n';
  txt += '━━━━━━━━━━━━━━━\n';
  txt += '🏪 الفرع: ' + branchName + '\n';
  txt += '📅 التاريخ: ' + date + '\n';
  txt += '💳 نوع الدفع: ' + payType + '\n';
  if(customer) txt += '👤 العميل: ' + customer + '\n';
  txt += '━━━━━━━━━━━━━━━\n\n';

  txt += '📦 *الأصناف:*\n';
  var total = 0;
  items.forEach(function(item, i){
    var qty = parseFloat(item.quantity || item.qty) || 0;
    var price = parseFloat(item.sellPrice || item.price) || 0;
    var itemTotal = parseFloat(item.total) || (qty * price);
    total += itemTotal;
    txt += (i+1) + '. ' + (item.product || item.productName || '-') + '\n';
    txt += '   ' + qty + ' × ' + fm(price) + ' = ' + fm(itemTotal) + ' ' + cs() + '\n';
  });

  txt += '\n━━━━━━━━━━━━━━━\n';
  txt += '💰 *الإجمالي: ' + fm(total) + ' ' + cs() + '*\n';
  txt += '━━━━━━━━━━━━━━━\n';

  if(notes) txt += '\n📝 ملاحظات: ' + notes + '\n';

  txt += '\nإعداد *عمر عثمان حميدو*\n';
  txt += 'نظام حميدو للمحاسبة';

  /* فتح واتساب */
  var encoded = encodeURIComponent(txt);
  var waUrl = 'https://wa.me/?text=' + encoded;

  try {
    window.open(waUrl, '_blank');
  } catch(e){
    /* بديل: نسخ النص */
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){
        mA('✅ تم نسخ الفاتورة\nالصقها في واتساب يدوياً');
      }).catch(function(){
        mA('❌ تعذّر فتح واتساب');
      });
    } else {
      mA('❌ تعذّر فتح واتساب');
    }
  }
}
